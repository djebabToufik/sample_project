[project]
name = "oee-backend"
# The release version lives in git tags and CHANGELOG.md (release-please), not here:
# a release then reuses the images already built and tested for this folder.
version = "0.0.0"
description = "Django backend (REST API and live WebSockets) of the OEE & CMMS software"
requires-python = "==3.13.*"
# Direct dependencies only; exact versions are in uv.lock.
dependencies = [
    "django>=5.2.8,<5.3",            # LTS until April 2028
    "djangorestframework>=3.16",
    "django-filter>=25.2",
    "django-rest-passwordreset>=1.5",
    "channels>=4.3",                 # WebSockets
    "channels-redis>=4.3",
    "redis>=6.4",                    # cache for the rate limits
    "psycopg[binary]>=3.2",          # PostgreSQL driver
    "pillow>=12",                    # image uploads
    "openpyxl>=3.1",                 # demo data (populate_demo)
    "gunicorn>=23",
    "uvicorn[standard]>=0.38",
    "uvicorn-worker>=0.4",           # gunicorn worker running the ASGI app
    "drf-spectacular>=0.30",
    "drf-spectacular-sidecar>=2026.1",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*", "*/tests.py", "*/test_*.py",
    "manage.py", "backend/asgi.py", "backend/wsgi.py",
    "healthcheck.py",  # Docker health check, runs outside the app
]
# Paths relative to backend/ in coverage.xml (Codecov maps them to the repository, codecov.yml).
relative_files = true
# Parts of the code run in other threads (WebSocket consumers, database_sync_to_async).
concurrency = ["thread"]

[tool.coverage.report]
skip_empty = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "preserve"
