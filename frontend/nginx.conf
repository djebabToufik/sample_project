# Serves the React build and forwards API, admin and WebSocket calls to Django.
# TLS is expected to end at a reverse proxy or load balancer in front of this container.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 5M;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri /index.html;
    }

    location /api/ { proxy_pass http://backend; }
    location /admin/ { proxy_pass http://backend; }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /staticapi/ { alias /backend/staticapi/; }

    # Uploaded files are only served after Django checked access (X-Accel-Redirect).
    location /protected-media/ {
        internal;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        alias /backend/media/;
    }

    location /media/ { return 404; }
}
