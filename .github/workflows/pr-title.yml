name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit on main.
# It must follow Conventional Commits: release-please builds versions and the changelog from it.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          # "fix: stop reconnecting", not "fix: Stop reconnecting".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the PR title "{title}" should start with a lowercase letter.
