name: Deploy demo

# Deploys a release to the public demo (infra/): AWS Systems Manager runs deploy/deploy.sh
# <version> on the server, which pulls that release's images (the ones tested in CI). Then the
# smoke test logs in to the live site over HTTPS with the demo account.
#
# Runs after each release (main.yml), or by hand for a given version. AWS access comes from
# GitHub's OIDC token: no AWS keys are stored here. The role only trusts this repository's
# "demo" environment. Skipped until the repository variables below are set (after terraform apply).
on:
  workflow_call:
    inputs:
      version:
        description: Release to deploy, e.g. 1.2.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy, e.g. 1.2.0
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the public demo
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.DEMO_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://demo.opensourceoeesoftware.com
    env:
      VERSION: ${{ inputs.version }}
      INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-demo-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Run the deploy on the server
        run: |
          script="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/deploy/deploy.sh"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $VERSION" \
            --timeout-seconds 900 \
            --parameters "commands=[\"curl -fsSL $script | bash -s -- $VERSION\"]" \
            --query Command.CommandId --output text)"
          echo "SSM command $command_id"

          # Wait up to 15 minutes (the first deploy pulls every image and creates the demo data).
          for _ in $(seq 1 90); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)"
            case "$status" in Pending | InProgress | Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Smoke test the live site
        env:
          SMOKE_USERNAME: demo
          SMOKE_PASSWORD: oee-demo
        run: .github/scripts/smoke-test.sh https://demo.opensourceoeesoftware.com

      - name: Summary
        run: |
          echo "### Deployed $VERSION to https://demo.opensourceoeesoftware.com" >> "$GITHUB_STEP_SUMMARY"
