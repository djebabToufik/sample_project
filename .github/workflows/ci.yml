name: CI

# Pull requests: lint and test the code, then make sure an image exists for each service,
# run the stack from them and smoke-test it.
#
# Each image is tagged tree-<hash>, the git tree hash of its build folder (backend/ or
# frontend/): the same files give the same tag. An image is only built, scanned and pushed
# when no image exists yet for its folder, so a pull request that does not touch a folder
# reuses that service's image. Branches must be up to date before merging, so main has the
# same folders as the tested merge, and main.yml promotes these exact images.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/djebabtoufik/sample_project

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: oee
          POSTGRES_USER: oee
          POSTGRES_PASSWORD: oee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oee" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OEE_SECRET_KEY: ci-only-secret
      OEE_DEBUG: "True"
      OEE_ALLOWED_HOSTS: localhost
      OEE_DB_NAME: oee
      OEE_DB_USER: oee
      OEE_DB_PASSWORD: oee
      OEE_DB_HOST: localhost
      OEE_DB_PORT: "5432"
      OEE_REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run python manage.py test

  frontend:
    name: Frontend (lint, types, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check and build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    name: Docker images (build, scan, smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests from forks get a read-only token: build and test, but do not push.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags from the build folders
        id: tags
        run: |
          for service in backend frontend; do
            tag="tree-$(git rev-parse --short=12 "HEAD:$service")"
            if docker buildx imagetools inspect "$IMAGE_PREFIX-$service:$tag" > /dev/null 2>&1; then
              exists=true
            else
              exists=false
            fi
            echo "$service-tag=$tag" >> "$GITHUB_OUTPUT"
            echo "$service-exists=$exists" >> "$GITHUB_OUTPUT"
            echo "$service: $tag (already built: $exists)"
          done

      - name: Build backend
        if: steps.tags.outputs.backend-exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.tags.outputs.backend-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sample_project-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        if: steps.tags.outputs.frontend-exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.tags.outputs.frontend-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sample_project-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Images that already exist were scanned when they were built.
      - name: Scan backend for critical vulnerabilities
        if: steps.tags.outputs.backend-exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.tags.outputs.backend-tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend for critical vulnerabilities
        if: steps.tags.outputs.frontend-exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.tags.outputs.frontend-tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Always runs: the services are tested together, whether built here or reused.
      - name: Start the stack from the images
        env:
          OEE_BACKEND_TAG: ${{ steps.tags.outputs.backend-tag }}
          OEE_FRONTEND_TAG: ${{ steps.tags.outputs.frontend-tag }}
        run: |
          # Reused images are only in the registry: pull them (compose does not for build services).
          for image in "$IMAGE_PREFIX-backend:$OEE_BACKEND_TAG" "$IMAGE_PREFIX-frontend:$OEE_FRONTEND_TAG"; do
            docker image inspect "$image" > /dev/null 2>&1 || docker pull --quiet "$image"
          done
          cp .env.example .env
          sed -i 's/^DEMO=.*/DEMO=false/' .env
          docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: .github/scripts/smoke-test.sh http://localhost

      - name: Stack logs
        if: failure()
        run: docker compose logs

      - name: Push new images
        env:
          BACKEND: ${{ steps.tags.outputs.backend-tag }} ${{ steps.tags.outputs.backend-exists }}
          FRONTEND: ${{ steps.tags.outputs.frontend-tag }} ${{ steps.tags.outputs.frontend-exists }}
        run: |
          {
            echo "### Images"
            echo "Smoke-tested together in this run. Merging promotes these exact images."
            echo "| Image | | Digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "backend $BACKEND" "frontend $FRONTEND"; do
            read -r service tag exists <<< "$entry"
            image="$IMAGE_PREFIX-$service:$tag"
            if [ "$exists" = "true" ]; then
              status="reused"
            elif [ "$PUSH" = "true" ]; then
              docker push --quiet "$image"
              status="built and pushed"
            else
              status="built (fork: not pushed)"
            fi
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image" 2> /dev/null || true)"
            echo "| \`$image\` | $status | \`${digest#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
