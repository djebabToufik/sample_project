name: Main

# After a merge to main: no rebuild. Pull requests already built, scanned and tested an image
# for each build folder (ci.yml: tree-<hash of backend/ or frontend/>), so they are retagged:
#   tree-<hash>  ->  sha-<commit>, main                  on every merge
#   tree-<hash>  ->  <version>, <major.minor>, latest    when a release is published
# A release only changes CHANGELOG.md and the manifest, so it reuses the images of the last
# merge. If an image is missing (e.g. a push that skipped the pull request), CI runs here first.
#
# release-please opens or updates the release PR (next version and CHANGELOG.md from the
# Conventional Commit titles). Merging that PR tags the release and publishes it on GitHub.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/djebabtoufik/sample_project

jobs:
  find-images:
    name: Find the tested images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend-tag: ${{ steps.find.outputs.backend-tag }}
      frontend-tag: ${{ steps.find.outputs.frontend-tag }}
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look up the image of each build folder
        id: find
        run: |
          found=true
          for service in backend frontend; do
            tag="tree-$(git rev-parse --short=12 "HEAD:$service")"
            if ! docker buildx imagetools inspect "$IMAGE_PREFIX-$service:$tag" > /dev/null 2>&1; then
              echo "::warning::No image $IMAGE_PREFIX-$service:$tag yet: building it here."
              found=false
            fi
            echo "$service-tag=$tag" >> "$GITHUB_OUTPUT"
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

  build:
    name: Build (images missing)
    needs: find-images
    if: needs.find-images.outputs.found != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml

  promote:
    name: Tag images for main
    needs: [find-images, build]
    if: always() && needs.find-images.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add sha and main tags
        env:
          BACKEND_TAG: ${{ needs.find-images.outputs.backend-tag }}
          FRONTEND_TAG: ${{ needs.find-images.outputs.frontend-tag }}
        run: |
          {
            echo "### Images promoted for main"
            echo "| Image | Tags | Digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "backend $BACKEND_TAG" "frontend $FRONTEND_TAG"; do
            read -r service TAG <<< "$entry"
            image="$IMAGE_PREFIX-$service"
            # Exact copy of the tested manifest inside the registry: same digest, nothing rebuilt.
            # (Without --prefer-index=false, buildx wraps it in a new index with another digest.)
            docker buildx imagetools create --prefer-index=false \
              -t "$image:sha-${GITHUB_SHA::7}" -t "$image:main" "$image:$TAG"
            digest="$(docker buildx imagetools inspect "$image:main" --format '{{.Manifest.Digest}}')"
            echo "| \`$image\` | \`$TAG\` \`sha-${GITHUB_SHA::7}\` \`main\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A personal access token lets CI run on the release PR (required checks).
          # With the default token, GitHub does not start workflows for the PRs it opens.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish-images:
    name: Tag images for the release
    needs: [find-images, promote, release-please]
    if: always() && needs.promote.result == 'success' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add version tags
        env:
          BACKEND_TAG: ${{ needs.find-images.outputs.backend-tag }}
          FRONTEND_TAG: ${{ needs.find-images.outputs.frontend-tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          MINOR: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        run: |
          {
            echo "### Release $VERSION images"
            echo "| Image | Tags | Digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "backend $BACKEND_TAG" "frontend $FRONTEND_TAG"; do
            read -r service TAG <<< "$entry"
            image="$IMAGE_PREFIX-$service"
            docker buildx imagetools create --prefer-index=false \
              -t "$image:$VERSION" -t "$image:$MINOR" -t "$image:latest" "$image:$TAG"
            digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
            echo "| \`$image\` | \`$VERSION\` \`$MINOR\` \`latest\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Run it: \`OEE_IMAGE_TAG=$VERSION docker compose up --no-build\`" >> "$GITHUB_STEP_SUMMARY"
