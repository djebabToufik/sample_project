# Weekly dependency updates. Minor and patch updates of an area come in one pull request
# (major ones alone, to be read), with Conventional Commit titles for the title check and
# the changelog. Every update goes through the same CI as any other pull request.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
    groups:
      compose-images:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        update-types: [minor, patch]
